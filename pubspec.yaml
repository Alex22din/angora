name: angora
description: "Cafeteria Angora - Premium Menu"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  uuid: ^4.2.1
  url_launcher: ^6.2.5
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/angoracat1.png
    - assets/images/angoracat2.png
    - assets/images/angoracat3.png
    - assets/images/angoracat4.png
    - assets/images/angoracat5.png
